name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1 (OIDC, no NPM_TOKEN).
      # Register this workflow filename (ci.yml) as a GitHub Actions
      # trusted publisher on the npm package settings page.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - name: Publish to npm
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "kkpromote@${version}" version 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "kkpromote@${version} is already on npm, skipping publish"
          else
            npm_latest="$(npm view kkpromote version 2>/dev/null || echo '0.0.0')"
            if [ "$version" != "$npm_latest" ] && [ "$(printf '%s\n%s' "$version" "$npm_latest" | sort -V | head -1)" = "$version" ]; then
              echo "Publishing kkpromote@${version} with dist-tag release-${version} (npm latest is ${npm_latest})"
              npm publish --tag "release-${version}"
            else
              npm publish
            fi
          fi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "${version} already exists, skipping GitHub Release"
          else
            gh release create "$version" --generate-notes --target "$GITHUB_SHA"
          fi
